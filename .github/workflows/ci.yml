name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Compile check
        run: python -m py_compile ghost_rec.py
      - name: Run logic tests
        # Headless-safe: conftest.py stubs mss/keyboard/sounddevice, so this
        # exercises the real session/mux/toggle logic against a fake screen.
        # Hotkeys, WASAPI audio and pythonw behaviour need a Windows machine.
        run: pytest -q
